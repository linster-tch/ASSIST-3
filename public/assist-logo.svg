<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="blueSwooshGrad" x1="120" y1="380" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="35%" stop-color="#2563EB" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="512" height="512" rx="100" fill="#0A0D14" />

  <!-- The Upper White Arch and Body of stylized "A" -->
  <path
    d="M 248 116 
       C 272 116, 290 128, 304 148 
       L 364 240 
       C 340 252, 310 262, 278 274 
       L 254 220 
       C 250 212, 244 206, 236 206 
       C 228 206, 222 212, 218 220 
       L 182 300 
       C 152 328, 128 350, 114 366 
       C 98 344, 94 322, 102 296 
       L 194 152 
       C 208 128, 226 116, 248 116 Z"
    fill="#FFFFFF"
  />

  <!-- Lower Right White Foot of "A" -->
  <path
    d="M 330 300
       C 354 286, 380 270, 404 254
       L 436 324
       C 446 346, 442 368, 424 384
       C 406 400, 384 402, 362 392
       Z"
    fill="#FFFFFF"
  />

  <!-- Dynamic Electric Blue Swoosh sweeping across and tapering -->
  <path
    d="M 112 370
       C 118 338, 144 316, 184 290
       C 230 260, 290 236, 372 196
       C 340 230, 286 270, 244 304
       C 204 336, 172 376, 142 396
       C 126 406, 108 398, 112 370 Z"
    fill="url(#blueSwooshGrad)"
  />

  <!-- Extended needle tail toward the star -->
  <path
    d="M 334 218
       C 368 198, 396 182, 420 170
       C 404 186, 382 204, 354 224
       Z"
    fill="#38BDF8"
  />

  <!-- 4-Pointed Sparkle Star at Upper Right -->
  <g filter="url(#starGlow)" transform="translate(426, 160)">
    <path
      d="M 0 -34
         Q 0 0, 34 0
         Q 0 0, 0 34
         Q 0 0, -34 0
         Q 0 0, 0 -34 Z"
      fill="#38BDF8"
    />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
  </g>
</svg>
